# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: MSBuild

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: ./src/AkelPad.sln  # Path to the directory containing build outputs.
  SOLUTION_DIR: ./src
  # Configuration type to build.
  # You can convert this to a build matrix if you need coverage of multiple configuration types.
  # https://docs.github.com/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
  BUILD_CONFIGURATION: Release

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        platform: [Win32, x64]

    steps:
      - uses: actions/checkout@v6

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Restore NuGet packages
        working-directory: ${{env.GITHUB_WORKSPACE}}
        run: nuget restore ${{env.SOLUTION_FILE_PATH}}

      - name: Build
        if: ${{ !cancelled() }}
        working-directory: ${{env.GITHUB_WORKSPACE}}
        shell: powershell
        # Add additional options to the MSBuild command line here (like platform or verbosity level).
        # See https://docs.microsoft.com/visualstudio/msbuild/msbuild-command-line-reference
        run: msbuild /m /p:Platform=${{matrix.platform}} /p:Configuration=${{env.BUILD_CONFIGURATION}} ${{env.SOLUTION_FILE_PATH}}

      - name: Package binaries
        shell: powershell
        run: |
          $target = "output/akelpad-${{ matrix.platform }}"
          if ("${{ matrix.platform }}" -eq "Win32") {
            $source = "${{ env.SOLUTION_DIR }}/${{ env.BUILD_CONFIGURATION }}"
          } else {
            $source = "${{ env.SOLUTION_DIR }}/${{ matrix.platform }}/${{ env.BUILD_CONFIGURATION }}"
          }
          if (-not (Test-Path $source)) { throw "Build output missing: $source" }
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item -Path "$source/*" -Destination $target -Recurse -Force
          Get-ChildItem -Path $target -Recurse -File |
            Where-Object { $_.Extension -in @('.pdb', '.lib', '.exp', '.ilk', '.bsc') } |
            Remove-Item -Force
          if (-not (Get-ChildItem -Path $target -Recurse -File | Where-Object { $_.Extension -in @('.exe', '.dll') })) {
            throw "No binaries found in $target"
          }
          if ("${{ github.ref }}" -like "refs/tags/v*") {
            Compress-Archive -Path "$target/*" -DestinationPath "$target.zip"
          }

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: akelpad-${{ matrix.platform }}
          path: output/akelpad-${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 30

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: output/*.zip
